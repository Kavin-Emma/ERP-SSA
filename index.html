<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP System Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <h2>ERP System Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address (admin@.com)" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password (admin123)" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
